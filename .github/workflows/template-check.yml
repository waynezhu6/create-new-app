# Checks each backend language the template offers: initializes a copy for it
# with scripts/init.mjs, builds its image the way deploy.yml does, and checks
# what the server's deployer relies on: /api/health on port 3001 after
# migrations, the frontend at /app/frontend/dist, and a clean exit on SIGTERM.
# Only the template runs it; init.mjs removes it from new apps.
name: Template check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event.repository.is_template }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        lang: [ts, python]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Initialize as ${{ matrix.lang }}
        run: node scripts/init.mjs --lang ${{ matrix.lang }}

      - name: Add a test migration
        run: |
          if [ ${{ matrix.lang }} = ts ]; then
            echo 'export const up = (pgm) => { pgm.createTable("check_table", { id: "id" }); };' > backend/migrations/1_check.js
          else
            echo 'create table check_table (id serial primary key);' > backend/migrations/1_check.sql
          fi

      - name: Build image
        run: docker build -f backend/Dockerfile --build-arg APP=check -t check-backend .

      - name: Run and check it
        run: |
          net=$(docker network ls --filter name=github_network --format '{{.Name}}' | head -1)
          docker run -d --name check --network "$net" \
            -e NODE_ENV=production -e PORT=3001 \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/app \
            -p 3001:3001 check-backend
          for i in $(seq 60); do
            curl -fsS localhost:3001/api/health && break
            sleep 1
          done || true
          curl -fsS localhost:3001/api/health | grep -q '"ok"' || { docker logs check; exit 1; }
          docker exec check test -f /app/frontend/dist/index.html
          docker run --rm --network "$net" postgres:16-alpine \
            psql postgres://postgres:postgres@postgres:5432/app -tAc 'select 1 from check_table limit 0' >/dev/null
          start=$(date +%s)
          docker stop -t 30 check
          code=$(docker inspect -f '{{.State.ExitCode}}' check)
          echo "Exited with $code after $(( $(date +%s) - start ))s"
          docker logs check
          [ "$code" = 0 ] || [ "$code" = 143 ] && [ $(( $(date +%s) - start )) -lt 10 ]

      - name: Nothing of the template left
        run: test ! -e stacks && test ! -e scripts/init.mjs && ! grep -rq -- '<!-- stack:\|<!-- template-only' README.md CLAUDE.md
